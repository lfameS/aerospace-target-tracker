name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow pytest
      - name: Run unit & kinematic occlusion tests
        run: pytest -v
      - name: Verify CLI tactical HUD rendering
        run: python cli.py --scenario ballistic_intercept --frames 38 --render assets/hud_preview.png --out /tmp/telemetry.json
